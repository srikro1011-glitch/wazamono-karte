<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>棚卸し 棚マスタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 案件カルテと同じ黒×金。棚番号は等幅で、現場で貼るラベルと同じ字面にする */
:root{
  --bg:#0b0a09; --panel:#13110f; --panel2:#1a1714; --field:#0e0d0b;
  --ink:#f4efe6; --sub:#a39a8b; --line:rgba(212,168,75,.22); --line2:rgba(255,255,255,.08);
  --gold:#d4a84b; --gold-hi:#f3dc9b; --gold-grad:linear-gradient(135deg,#f3dc9b 0%,#d4a84b 42%,#9a6f22 100%);
  --ok:#8bd0a0; --warn:#e6b25a; --err:#f08a80;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.7 system-ui,-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 88% -8%,rgba(255,255,255,.07),transparent 62%),
  radial-gradient(700px 500px at 10% 110%,rgba(212,168,75,.09),transparent 62%),var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding-block:0 120px;padding-inline:16px}
.mark{display:inline-flex;align-items:baseline;gap:6px;line-height:1;color:#fff}
.mark .wz{font:800 17px/1.05 var(--serif);font-style:italic}
.mark .wk{font:500 11px/1 var(--serif);letter-spacing:.3em}
.eyebrow{font:11px/1 var(--mono);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
label,.lb{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 6px;letter-spacing:.06em}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line2);background:var(--field);border-radius:8px;outline:none;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,75,.18)}
textarea{min-height:110px;resize:vertical;font-family:var(--mono);font-size:12px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.btn{background:var(--gold-grad);color:#1a1206;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--gold)}
.btn.danger{background:none;border:1px solid rgba(240,138,128,.5);color:var(--err)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.link:focus-visible,.tab:focus-visible,.ic:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.link{background:none;border:0;color:var(--sub);cursor:pointer;padding:4px 0;font-size:13px;text-decoration:underline}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* 上部バー */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,10,9,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar select{width:auto;flex:1;min-width:0;padding:8px 36px 8px 12px;font-family:var(--serif);font-weight:700}
.stat{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);white-space:nowrap;color:var(--sub);cursor:pointer;background:none}
.stat.saved{color:var(--ok);border-color:rgba(139,208,160,.4)}
.stat.dirty,.stat.saving,.stat.off{color:var(--warn);border-color:rgba(230,178,90,.45)}
.stat.error,.stat.none{color:var(--err);border-color:rgba(240,138,128,.5)}
.tabs{display:flex;gap:4px;width:100%;border-top:1px solid var(--line2);padding-top:8px}
.tab{flex:1;background:none;border:0;border-radius:8px;padding:9px 0;color:var(--sub);cursor:pointer;font-weight:600;letter-spacing:0;font-size:13px;white-space:nowrap}
.tab.on{color:#1a1206;background:var(--gold-grad)}

.hero{padding:22px 0 4px}
.hero h2{font-size:26px}
.hero p{color:var(--sub);margin:6px 0 0;max-width:40em;font-size:14px}
.notice{border:1px solid rgba(230,178,90,.45);border-left:3px solid var(--warn);background:var(--panel);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13.5px;color:var(--warn)}
.notice.err{border-color:rgba(240,138,128,.5);border-left-color:var(--err);color:var(--err)}

/* 場所・棚・品目 */
.loc{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.loc>.head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.loc .code{font:800 22px/1 var(--serif);font-style:italic;color:var(--gold);min-width:30px}
.loc .nm{flex:1;font:700 17px/1.3 var(--serif);min-width:0}
.loc .nm small{display:block;font:11px/1.4 var(--mono);color:var(--sub);letter-spacing:.1em;margin-top:3px}
.loc>.body{padding:4px 12px 14px}
.shelf{border:1px solid var(--line2);border-radius:10px;background:var(--field);margin-top:10px;overflow:hidden}
.shelf>.head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.no{font:700 14px/1 var(--mono);letter-spacing:.08em;color:#1a1206;background:var(--gold-grad);padding:5px 8px;border-radius:5px;white-space:nowrap}
.shelf .nm{flex:1 1 110px;font-weight:700;min-width:0;overflow-wrap:anywhere;cursor:text}
.shelf .cnt{font-size:12px;color:var(--sub);white-space:nowrap}
.ic{background:none;border:1px solid var(--line2);color:var(--sub);border-radius:6px;width:30px;height:30px;cursor:pointer;line-height:1;padding:0;flex:none}
.ic:hover{border-color:var(--gold);color:var(--gold)}
.items{padding:4px 12px 10px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px dashed var(--line2);align-items:center}
.it:last-child{border-bottom:0}
.it .ph{grid-column:1;grid-row:1/3;width:46px;height:46px;border-radius:7px;object-fit:cover;background:var(--panel2);border:1px solid var(--line2);display:block}
.it .ph.none{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px}
.it .n{grid-column:2;grid-row:1;font-weight:700;overflow-wrap:anywhere;min-width:0}
.it .n .star{color:var(--gold-hi);margin-right:4px}
.it .d{grid-column:2;grid-row:2;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.it .ops{grid-column:3;grid-row:1/3;display:flex;gap:6px}
.empty{color:var(--sub);font-size:13.5px;padding:10px 0}
.form{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px 16px 16px;margin-top:12px}
.two{display:grid;gap:0 12px}
@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.three{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
@media(min-width:600px){.three{grid-template-columns:1fr 1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cb{border:1px solid var(--line2);background:var(--field);color:var(--sub);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.cb.on{border-color:var(--gold);color:#1a1206;background:var(--gold-grad);font-weight:700}
.note{font-size:12px;color:var(--sub);margin-top:5px}
.confirm{display:inline-flex;gap:6px;align-items:center}
.inline{display:flex;gap:8px;align-items:center;margin-top:10px}
.inline input{flex:1;min-width:0}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px dashed var(--gold);color:var(--gold);padding:8px 13px;border-radius:8px;font-weight:600;margin:0;font-size:13.5px}
.filebtn input{display:none}
.photo{display:flex;gap:10px;align-items:center;margin-top:10px}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.shelfph{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);flex:none;display:block}

/* 棚卸し */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11.5px;color:var(--sub);letter-spacing:.06em}
.tile .v{font:700 22px/1.2 var(--serif);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--sub);font-family:system-ui}
.prog{height:3px;background:var(--line2);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .3s}
.row{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line2)}
.row:last-child{border-bottom:0}
.row .ph{grid-column:1;width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--line2);background:var(--panel2);display:block}
.row .n{font-weight:700;overflow-wrap:anywhere}
.row .d{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.row input{grid-column:3;text-align:right;font-variant-numeric:tabular-nums;padding:9px 10px;font-size:18px}
.row input.done{border-color:rgba(139,208,160,.5)}
.hist{margin-top:10px}
.hist .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line2);font-size:14px;font-variant-numeric:tabular-nums}
.hist .r b{font-family:var(--serif)}
.mr{margin-top:16px}
.mr .eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px;font-variant-numeric:tabular-nums}
.mr .eq div{background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.mr .eq .k{font-size:11px;color:var(--sub)}
.mr .eq .v{font-weight:700;font-size:16px}
.mr .eq .v.big{color:var(--gold-hi);font-size:20px;font-family:var(--serif)}

.badge{display:inline-block;font:600 10.5px/1 system-ui;padding:3px 7px;border-radius:99px;border:1px solid var(--line);color:var(--gold);margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.badge.prep{color:var(--ok);border-color:rgba(139,208,160,.5)}
details.more{margin-top:12px;border:1px solid var(--line2);border-radius:10px;background:var(--field)}
details.more>summary{list-style:none;cursor:pointer;padding:10px 12px;color:var(--gold);font-weight:600;font-size:13.5px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";float:right}
details.more[open]>summary::after{content:"－"}
details.more>.in{padding:0 12px 12px}
.send{margin-top:22px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.send .msg{flex:1;min-width:0;font-size:12.5px;color:var(--sub);line-height:1.45}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick .cb{font-size:12.5px;padding:5px 10px}
/* 価格 */
.pr{border:1px solid var(--line2);border-radius:10px;background:var(--field);margin-top:10px;padding:10px 12px}
.pr .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pr .top .n{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.pr .cur{font-size:12.5px;color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .cur.none{color:var(--warn)}
.pr .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
@media(min-width:600px){.pr .g{grid-template-columns:1.2fr .8fr 1fr 1fr auto}}
.pr .g input,.pr .g select{padding:8px 9px;font-size:15px}
.pr .g label{margin:0 0 3px;font-size:11px}
.pr .hist{font-size:12px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums}
.pr .btn{align-self:end}
/* 書き出し・設定 */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h3{font-size:17px}
.card p{color:var(--sub);font-size:13.5px;margin:6px 0 0}
.card a{color:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line2);padding:5px 8px;text-align:left;white-space:nowrap}
th{color:var(--gold);font-weight:600}
.tw{overflow-x:auto;margin-top:10px;max-height:260px;border:1px solid var(--line2);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold-grad);color:#1a1206;font-weight:700;padding:10px 18px;border-radius:99px;font-size:14px;z-index:50;max-width:90vw}
.diag{white-space:pre-wrap;word-break:break-all;font:11px/1.6 var(--mono);color:var(--sub);background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:10px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar"><div class="in">
  <div class="mark"><span class="wz">ワザモノ</span><span class="wk">works</span></div>
  <select id="store" aria-label="店舗"></select>
  <button class="stat" id="stat" title="同期の状態。タップで設定">－</button>
  <div class="tabs" role="tablist">
    <button class="tab on" data-v="reg" role="tab">棚の登録</button>
    <button class="tab" data-v="count" role="tab">棚卸し</button>
    <button class="tab" data-v="price" role="tab">価格</button>
    <button class="tab" data-v="out" role="tab">書き出し</button>
    <button class="tab" data-v="cfg" role="tab">設定</button>
  </div>
</div></div>
<div class="wrap"><div id="app"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   棚卸し 棚マスタ
   ・管理者が営業後に店へ入り、場所ごとに棚へ番号を振って品目（名前・写真・風袋・単価）を登録する
   ・店長はその番号順に数量を入れるだけ（棚卸しモード）。はかりで量るものは風袋を自動で引く
   ・入力は端末へ即保存し、数秒後にスプレッドシートへ自動同期。他の端末の変更は30秒ごとに取り込む
   ・写真は Drive へ上げ、スプレッドシートにはURLを書く
   ・同期先は Apps Script のウェブアプリ（tanaoroshi.gs）。GAS上で開けば設定不要、別サイトとして開くときはURLを設定に入れる
   ========================================================= */
const STORES = ['鯛ドロボー','島ドロボー','志知カフェ','麺ドロボー','牛と米','AWAWA','わぎゅぎゅ','北淡シマウマ'];
const LOC_PRESETS = ['冷蔵庫','冷凍庫','乾物・調味料','米・油','ドリンク','資材・備品','仕込み場','その他'];
const UNITS = ['kg','g','個','パック','本','袋','箱','ケース','缶','尾','枚','バット'];
const CONV_UNITS = ['g','個','ml','尾','枚'];
const KEY = 'tana:v2';
const POLL_MS = 30000;
const APP_VER = '2026-10-12 r6';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,，]/g, '')); return isNaN(n) ? null : n; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 初期データ：鯛ドロボー（理想と現実のFシートのレシピ単価＋8月MRシートの品目から） ---------- */
function seedTai(){
  const it = (name, unit, conv, convUnit, price, vendor, star, memo, tare) => ({ id:uid('i'), name, unit, conv, convUnit, price, vendor, star:!!star, prep:false, madeFrom:[], fName:'', memo:memo||'', tare:tare||null, photo:null, buyUnit:unit, pack:1, prices: price != null ? [{ id:uid('q'), date:'2026-08-01', buyUnit:unit, pack:1, price, tax:'抜', vendor:'', memo:'レシピマスターの単価' }] : [] });
  return {
    note:'配置は仮です。10/20 の棚卸しで現地に合わせて直してください。単価はレシピマスターの仕入れ単価（8月時点）。',
    locations:[
      { id:uid('l'), code:'', name:'冷蔵庫', shelves:[
        { id:uid('s'), label:'1', name:'刺身（上段）', photo:null, items:[
          it('鯛（捌き後）','パック',350,'g',1701,'',1),
          it('本マグロ赤身','パック',600,'g',3240,'',1),
          it('本マグロ中トロ','パック',500,'g',6480,'',1),
          it('ネギトロ／たたき','パック',500,'g',1298,'',1),
          it('サーモン','パック',800,'g',4644,'',1),
          it('生キハダ','g',1,'g',null,'魚福',1,'単価は店長記入。バットごと量る',0),
        ]},
        { id:uid('s'), label:'2', name:'うに・いくら', photo:null, items:[
          it('うに','箱',100,'g',1188,'',1),
          it('いくら','パック',500,'g',5700,'',1),
        ]},
        { id:uid('s'), label:'3', name:'卵・野菜', photo:null, items:[
          it('卵（蘭王）','ケース',null,'個',null,'',1,'1ケース何個か要確認'),
          it('大和芋','kg',1000,'g',null,'',0),
          it('玉ねぎ（オニスラ用）','箱',null,'g',null,'',0,'8月メモ：1日2箱'),
          it('わさび','本',null,'g',null,'',0),
        ]},
      ]},
      { id:uid('l'), code:'', name:'冷凍庫', shelves:[
        { id:uid('s'), label:'1', name:'エビ', photo:null, items:[
          it('伸ばしエビ','袋',null,'尾',null,'',1,'8月の廃棄 17,442円'),
          it('有頭エビ','袋',14,'尾',null,'',0),
        ]},
      ]},
      { id:uid('l'), code:'', name:'乾物・調味料', shelves:[
        { id:uid('s'), label:'1', name:'調味料', photo:null, items:[
          it('甘口醤油','本',null,'ml',null,'',0),
          it('三杯酢（高橋）','本',null,'ml',1058,'',0),
          it('濃口醤油','本',null,'ml',null,'',0),
          it('みりん','本',null,'ml',null,'',0),
        ]},
        { id:uid('s'), label:'2', name:'乾物', photo:null, items:[
          it('鰹節','袋',null,'g',1617,'',0,'8月メモ：1日2袋'),
          it('刻み海苔','袋',100,'g',null,'',0),
          it('天ぷら粉','袋',null,'g',null,'',0),
        ]},
      ]},
      { id:uid('l'), code:'', name:'米・油', shelves:[
        { id:uid('s'), label:'1', name:'米・油', photo:null, items:[
          it('米（つや姫）','袋',5000,'g',null,'',1),
          it('油','缶',null,'ml',null,'',0),
        ]},
      ]},
    ],
    counts:[],
  };
}

/* ---------- 端末内保存 ---------- */
let DB = null;
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(KEY + ':' + k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
function emptyStore(){ return { note:'', locations:[], counts:[], masterRev:0, dirty:false }; }
function load(){
  DB = ls.get('db');
  if (!DB || !DB.stores) DB = { ver:2, stores:{} };

/* 棚の呼び方は店ごとに違う（冷蔵庫1、a、上段…）ので、棚のラベルは自由入力。場所に記号があれば「R-1」、無ければ「冷蔵庫 1」 */

/* ---------- サーバー呼び出し（案件カルテと同じ形） ---------- */
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const MOCK = /[?&]mock=1/.test(location.search);

function api(fn, arg){
  const call = new Promise((resolve, reject) => {
    const done = r => { if (r && r.ok) resolve(r.data); else { const e = new Error((r && r.error) || 'error'); e.code = r && r.error; reject(e); } };
    if (IN_GAS) google.script.run.withSuccessHandler(done).withFailureHandler(e => reject(new Error((e && e.message) || String(e)))).rpc(fn, CFG.pw, arg);
    else if (MOCK) mockRpc(fn, CFG.pw, arg).then(done, reject);
    else if (CFG.url) fetch(CFG.url, { method:'POST', body:JSON.stringify({ fn, pw:CFG.pw, arg }) }).then(r => r.json()).then(done, e => reject(new Error('サーバーに接続できません（' + ((e && e.message) || e) + '）')));
    else reject(new Error('同期先が未設定'));

  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('通信がタイムアウトしました')), 45000));

/* 画面だけ試すときの疑似サーバー（?mock=1）。端末内に保存する */
async function mockRpc(fn, pw, arg){

  const st = db.stores[arg.store] || (db.stores[arg.store] = { masterRev:0, master:{ note:'', locations:[] }, counts:[] });
  let data = null;
  if (fn === 'version') data = { masterRev:st.masterRev, countsRev:st.counts.length };
  else if (fn === 'pull') data = { masterRev:st.masterRev, master:st.master, counts:st.counts, sheetUrl:'https://docs.google.com/spreadsheets/d/mock' };
  else if (fn === 'pushMaster') { if (arg.base !== st.masterRev) data = { conflict:true, masterRev:st.masterRev, master:st.master }; else { st.master = arg.master; st.masterRev++; data = { masterRev:st.masterRev }; } }
  else if (fn === 'pushCounts') { arg.counts.forEach(c => { const i = st.counts.findIndex(x => x.id === c.id); if (i >= 0) st.counts[i] = c; else st.counts.push(c); }); data = { n:arg.counts.length }; }

}

/* ---------- 同期 ---------- */
function setNet(st, msg){ S.net = st; S.netMsg = msg || ''; const el = $('#stat'); if (!el) return; el.className = 'stat ' + st; el.textContent = { none:'同期先なし', saved:'同期済み', saving:'送信中…', dirty:'未送信', off:'オフライン', error:'送信エラー' }[st] || st; el.title = msg || '同期の状態。タップで設定'; }
function markMaster(){ const st = cur(); st.dirty = true; S.localRev++; save(); setNet('dirty'); clearTimeout(markMaster.t); markMaster.t = setTimeout(pushMaster, 1500); }
async function uploadPending(st){

    const targets = [sh.photo, ...sh.items.map(i => i.photo)].filter(p => p && p.dataUrl && !p.url);
    for (const p of targets) { const r = await api('uploadPhoto', { name:(S.store + '_' + (p.id || uid('p')) + '.jpg'), dataUrl:p.dataUrl }); p.url = r.url; p.id = r.id || p.id; delete p.dataUrl; save(); }

async function pushMaster(){

    if (r.conflict) { Object.assign(st, { note:r.master.note || '', locations:r.master.locations, masterRev:r.masterRev, dirty:false }); save(); toast('他の端末で先に変更されていたので、その内容を取り込みました。もう一度操作してください'); if (S.store === store) render(); }

async function pushCounts(){

/* ---------- 操作 ---------- */
function find(id){
  for (const loc of cur().locations) { if (loc.id === id) return { loc }; for (const sh of loc.shelves) { if (sh.id === id) return { loc, sh }; for (const it of sh.items) if (it.id === id) return { loc, sh, it }; } }
  return null;
}
function onClick(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, st = cur();
  const locEl = b.closest('[data-loc]'), shEl = b.closest('[data-shelf]'), itEl = b.closest('[data-item]');
  const loc = locEl && st.locations.find(l => l.id === locEl.dataset.loc);
  const sh = loc && shEl && loc.shelves.find(s => s.id === shEl.dataset.shelf);
  const it = sh && itEl && sh.items.find(i => i.id === itEl.dataset.item);
  const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  switch (act) {
    case 'addloc': addLoc('', b.dataset.name); break;
    case 'addloc-free': { const nm = $('#nlname').value.trim(), cd = $('#nlcode').value.trim().toUpperCase(); if (!nm) return toast('場所の名前を入れてください'); addLoc(cd, nm); break; }
    case 'loc-up': move(st.locations, st.locations.indexOf(loc), -1); markMaster(); render(); break;
    case 'loc-down': move(st.locations, st.locations.indexOf(loc), 1); markMaster(); render(); break;
    case 'addshelf': S.newShelf = loc.id; render(); { const i = $('#nslabel'); if (i) { i.focus(); i.select(); } } break;
    case 'addshelf-cancel': S.newShelf = null; render(); break;
    case 'addshelf-go': { const lb = $('#nslabel').value.trim() || nextLabel(loc), nm = $('#nsname').value.trim(); const sh2 = { id:uid('s'), label:lb, name:nm, photo:null, items:[] }; loc.shelves.push(sh2); S.newShelf = null; markMaster(); render(); toast(shelfNo(loc, sh2) + ' を追加しました'); break; }
    case 'shelf-up': move(loc.shelves, loc.shelves.indexOf(sh), -1); markMaster(); render(); break;
    case 'shelf-down': move(loc.shelves, loc.shelves.indexOf(sh), 1); markMaster(); render(); break;
    case 'rename-shelf': { const inp = document.createElement('input'); inp.value = sh.name; inp.placeholder = '棚の名前（例：上段・野菜室）'; inp.style.cssText = 'padding:6px 8px;font-size:14px'; b.replaceWith(inp); inp.focus();
      let done = false; const fin = () => { if (done) return; done = true; if (sh.name !== inp.value.trim()) { sh.name = inp.value.trim(); markMaster(); } render(); }; inp.onblur = fin; inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); }; break; }
    case 'new-item': S.form = { shelf:sh.id, name:'', qty:'', unit:UNITS[0], conv:'', convUnit:'g', price:null, prices:[], buyUnit:UNITS[0], pack:'', newPrice:'', tax:'抜', newDate:today(), tare:'', vendor:'', memo:'', star:false, prep:false, madeFrom:[], fName:'', photo:null, editingId:null, open:false }; render(); focusForm(); break;
    case 'edit-item': { const lp = latestP(it); const qn = qtyNow(it); S.form = { shelf:sh.id, ...it, qty:qn && qn.draft ? qn.raw : '', prices:(it.prices || []).map(p => ({ ...p })), madeFrom:(it.madeFrom || []).slice(), photo:it.photo ? { ...it.photo } : null, buyUnit:it.buyUnit || (lp && lp.buyUnit) || it.unit, pack:it.pack ?? (lp && lp.pack) ?? '', newPrice:'', tax:(lp && lp.tax) || '抜', newDate:today(), editingId:it.id }; render(); focusForm(); break; }
    case 'set-unit': readForm(); S.form.unit = b.dataset.u; render(); break;
    case 'set-tax': readForm(); S.form.tax = b.dataset.t; render(); break;
    case 'toggle-prep': readForm(); S.form.prep = !S.form.prep; render(); break;
    case 'toggle-made': { readForm(); const a = S.form.madeFrom || (S.form.madeFrom = []); const k = a.indexOf(b.dataset.id); if (k >= 0) a.splice(k, 1); else a.push(b.dataset.id); render(); break; }
    case 'send-sheet': sendSheet(); break;
    case 'rename-loc': { const inp = document.createElement('input'); inp.value = loc.name; inp.style.cssText = 'padding:6px 8px;font-size:15px'; b.replaceWith(inp); inp.focus();
      let done = false; const fin = () => { if (done) return; done = true; const v = inp.value.trim(); if (v && v !== loc.name) { loc.name = v; markMaster(); } render(); }; inp.onblur = fin; inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); }; break; }
    case 'relabel-shelf': { const inp = document.createElement('input'); inp.value = shelfLabel(sh); inp.style.cssText = 'padding:6px 8px;font-size:14px;width:90px'; b.replaceWith(inp); inp.focus(); inp.select();
      let done = false; const fin = () => { if (done) return; done = true; const v = inp.value.trim(); if (v && v !== shelfLabel(sh)) { sh.label = v; markMaster(); } render(); }; inp.onblur = fin; inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); }; break; }
    case 'toggle-star': readForm(); S.form.star = !S.form.star; render(); break;
    case 'del-photo': readForm(); S.form.photo = null; render(); break;
    case 'cancel-item': S.form = null; render(); break;
    case 'save-item': saveItem(); break;
    case 'ask-del': S.confirmId = b.dataset.id; render(); break;
    case 'cancel-del': S.confirmId = null; render(); break;
    case 'del-loc': st.locations = st.locations.filter(l => l !== loc); S.confirmId = null; markMaster(); render(); break;
    case 'del-shelf': loc.shelves = loc.shelves.filter(s => s !== sh); S.confirmId = null; markMaster(); render(); break;
    case 'del-item': sh.items = sh.items.filter(i => i !== it); S.confirmId = null; markMaster(); render(); break;
    case 'del-count': { const id = b.dataset.id; st.counts = st.counts.filter(c => c.id !== id); S.confirmId = null; save(); render(); if (canSync()) api('deleteCount', { store:S.store, id }).catch(e => toast('シート側の削除に失敗: ' + e.message)); break; }
    case 'close-count': closeCount(); break;
    case 'clear-count': S.draftCount = { date:today(), by:draft().by, qty:{}, purchases:'', sales:'' }; saveDraft(); render(); break;
    case 'copy': copyOut(b.dataset.what); break;
    case 'dl': download(b.dataset.what); break;
    case 'import': importJson($('#imp').value); break;
    case 'wipe': DB.stores[S.store] = emptyStore(); DB.stores[S.store].seeded = true; S.confirmId = null; S.draftCount = null; save(); toast('端末から消しました'); render(); pull(S.store); break;
    case 'save-cfg': { CFG.name = $('#g-name').value.trim(); CFG.pw = $('#g-pw').value; const u = $('#g-url'); if (u) CFG.url = u.value.trim(); ls.set('cfg', CFG); toast('保存しました'); pull(S.store); setView('reg'); break; }
    case 'diag': runDiag(); break;
    case 'add-price': addPrice(b.closest('[data-pitem]')); break;
  }
}
function addLoc(code, name){
  const st = cur();
  if (st.locations.some(l => l.name === name)) { let n = 2; while (st.locations.some(l => l.name === name + n)) n++; name = name + n; }
  if (code && st.locations.some(l => l.code === code)) { let n = 2; while (st.locations.some(l => l.code === code + n)) n++; code = code + n; }
  st.locations.push({ id:uid('l'), code, name, shelves:[] }); markMaster(); render();
}
function focusForm(){ const el = $('#f-name'); if (el) { el.scrollIntoView({ block:'center' }); el.focus(); } }
function readForm(){
  const f = S.form; if (!f || !$('#itemform')) return;
  f.name = $('#f-name').value; f.qty = $('#f-qty').value; f.conv = $('#f-conv').value; f.convUnit = $('#f-convu').value; f.newPrice = $('#f-price').value; f.buyUnit = $('#f-buyunit').value; f.pack = $('#f-pack').value; f.newDate = $('#f-pdate').value; f.tare = $('#f-tare').value; f.vendor = $('#f-vendor').value; f.memo = $('#f-memo').value; f.fName = $('#f-fname').value; f.open = $('#itemform details.more').open;
}
function saveItem(){
  readForm(); const f = S.form; const name = f.name.trim(); if (!name) { toast('材料の名前を入れてください'); return $('#f-name').focus(); }
  const r = find(f.shelf); if (!r) return;
    const prices = (f.prices || []).map(p => ({ ...p }));
  if (num(f.newPrice) != null) prices.push({ id:uid('q'), date:f.newDate || today(), buyUnit:f.buyUnit || f.unit, pack:num(f.pack) > 0 ? num(f.pack) : 1, price:num(f.newPrice), tax:f.tax || '抜', vendor:f.vendor.trim(), memo:'' });
  const rec = { id:f.editingId || uid('i'), name, unit:f.unit, conv:num(f.conv), convUnit:f.convUnit, buyUnit:f.buyUnit || f.unit, pack:num(f.pack) > 0 ? num(f.pack) : 1, prices, price:unitPrice(latestP({ prices }), f.price), tare:num(f.tare), vendor:f.vendor.trim(), star:!!f.star, prep:!!f.prep, madeFrom:f.prep ? (f.madeFrom || []) : [], fName:(f.fName || '').trim(), memo:f.memo.trim(), photo:f.photo || null };
  { const d = draft(); if (num(f.qty) != null) d.qty[rec.id] = String(f.qty).trim(); else delete d.qty[rec.id]; saveDraft(); }
  if (f.editingId) { const i = r.sh.items.findIndex(x => x.id === f.editingId); r.sh.items[i] = rec; S.form = null; }
  else { r.sh.items.push(rec); S.form = { ...S.form, name:'', qty:'', conv:'', price:null, prices:[], pack:'', newPrice:'', tare:'', memo:'', star:false, prep:false, madeFrom:[], fName:'', photo:null, editingId:null, open:false }; }
  markMaster(); render(); if (!f.editingId) focusForm(); toast(f.editingId ? '更新しました' : name + ' を登録しました');
}
function onInput(e){
  const t = e.target;
  if (t.dataset.qty) { S.draftCount.qty[t.dataset.qty] = t.value; t.classList.toggle('done', num(t.value) != null); saveDraft(); updateCountTiles(); return; }
  if (t.id === 'c-by') { S.draftCount.by = t.value; saveDraft(); }
  if (t.id === 'c-pur') { S.draftCount.purchases = t.value; saveDraft(); updateCountTiles(); }
  if (t.id === 'c-sales') { S.draftCount.sales = t.value; saveDraft(); updateCountTiles(); }
}
async function onChange(e){
  const t = e.target;
  if (t.id === 'c-date') { S.draftCount.date = t.value; saveDraft(); }
  if (t.id === 'impfile' && t.files[0]) { const fr = new FileReader(); fr.onload = () => importJson(fr.result); fr.readAsText(t.files[0]); }
  if (t.id === 'f-photo' && t.files[0]) { readForm(); try { S.form.photo = { id:uid('p'), dataUrl:await compress(t.files[0]) }; render(); } catch (err) { toast('写真を読み込めませんでした'); } }
  if (t.dataset.shelfphoto && t.files[0]) { const r = find(t.dataset.shelfphoto); if (!r) return; try { r.sh.photo = { id:uid('p'), dataUrl:await compress(t.files[0]) }; markMaster(); render(); } catch (err) { toast('写真を読み込めませんでした'); } }
}
function compress(file, max = 1000, q = 0.75){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}
let tileT;
function updateCountTiles(){ clearTimeout(tileT); tileT = setTimeout(() => { if (S.view !== 'count') return; const y = scrollY; const a = document.activeElement; const id = a && a.dataset.qty; renderCount(); scrollTo(0, y); if (id) { const el = $(`[data-qty="${id}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } else if (a && a.id) { const el = $('#' + a.id); if (el) el.focus(); } }, 400); }
function saveDraft(){ ls.set('draft:' + S.store, S.draftCount); }
function closeCount(quiet){
  const st = cur(), d = draft(), rows = allItems(st);
  const qty = {}, qtyRaw = {}; rows.forEach(r => { const n = netQty(r.item, d.qty[r.item.id]); if (n != null) { qty[r.item.id] = n; if (isWeighed(r.item)) qtyRaw[r.item.id] = num(d.qty[r.item.id]); } });
  if (!Object.keys(qty).length) { if (!quiet) toast('数量が1つも入っていません'); return null; }
  const pz = i => priceAt(i, d.date || today());
  const total = rows.reduce((a, r) => a + (qty[r.item.id] || 0) * (pz(r.item) || 0), 0);
  const starTotal = rows.filter(r => r.item.star).reduce((a, r) => a + (qty[r.item.id] || 0) * (pz(r.item) || 0), 0);
  const last = lastCount(st), pur = num(d.purchases), sales = num(d.sales);
  const cogs = last && pur != null ? last.total + pur - total : null;
  const lines = rows.filter(r => qty[r.item.id] != null).map(r => ({ shelf:shelfNo(r.loc, r.shelf), item:r.item.name, unit:r.item.unit, qty:qty[r.item.id], raw:qtyRaw[r.item.id] ?? null, tare:r.item.tare ?? null, price:pz(r.item), amount:pz(r.item) != null ? Math.round(qty[r.item.id] * pz(r.item)) : null, star:!!r.item.star, prep:!!r.item.prep }));
  const prepTotal = rows.filter(r => r.item.prep).reduce((a, r) => a + (qty[r.item.id] || 0) * (pz(r.item) || 0), 0);
  st.counts.push({ id:uid('c'), date:d.date || today(), by:d.by.trim(), qty, qtyRaw, lines, total:Math.round(total), starTotal:Math.round(starTotal), prepTotal:Math.round(prepTotal), purchases:pur, sales, cogs:cogs != null ? Math.round(cogs) : null, mr:cogs != null && sales ? cogs / sales * 100 : null, closedAt:new Date().toISOString(), synced:false });
  st.counts.sort((a, b) => a.date < b.date ? -1 : 1);
  const rec = st.counts.find(c => c.closedAt && c.qty === qty) || st.counts[st.counts.length - 1];
  S.draftCount = { date:today(), by:d.by, qty:{}, purchases:'', sales:'' }; saveDraft(); save();
  if (!quiet) { render(); toast('締めました：' + yen(total)); pushCounts(); }
  return rec;
}
function copyOut(what){
  const st = cur(); const last = lastCount(st);
  const text = what === 'master' ? tsv(masterRows(st)) : what === 'count' ? tsv(countRows(st, last)) : JSON.stringify({ store:S.store, exportedAt:new Date().toISOString(), note:st.note, locations:st.locations, counts:st.counts }, null, 1);
  const fallback = () => { const ta = $('#clip'); ta.value = text; ta.focus(); ta.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch (e) { toast('コピーできませんでした'); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('コピーしました。スプレッドシートのセルに貼ってください'), fallback); else fallback();
}
function download(what){
  const st = cur(); const last = lastCount(st);
  const csv = rows => '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const [text, name, type] = what === 'master' ? [csv(masterRows(st)), `${S.store}_品目マスタ_${today()}.csv`, 'text/csv'] : what === 'count' ? [csv(countRows(st, last)), `${S.store}_棚卸し_${last.date}.csv`, 'text/csv'] : [JSON.stringify({ store:S.store, note:st.note, locations:st.locations, counts:st.counts }, null, 1), `${S.store}_棚卸しデータ_${today()}.json`, 'application/json'];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('ダウンロードが始まらない場合は「コピー」を使ってください');
}
function importJson(text){
  let j; try { j = JSON.parse(text); } catch (e) { return toast('JSONとして読めませんでした'); }
  if (!j || !Array.isArray(j.locations)) return toast('この形式は取り込めません（locations がありません）');
  const st = cur(); st.note = j.note || ''; st.locations = j.locations; st.counts = (Array.isArray(j.counts) ? j.counts : []).map(c => ({ ...c, synced:false })); st.seeded = true;
  S.draftCount = null; markMaster(); pushCounts(); toast('取り込みました'); setView('reg');
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
addEventListener('error', e => { const el = $('#toast'); if (el) { el.textContent = '画面でエラー: ' + e.message; el.hidden = false; } });
boot();
</script>
