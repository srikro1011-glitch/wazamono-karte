<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>ワザモノworks 案件カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a09; --panel:#13110f; --panel2:#1a1714; --field:#0e0d0b;
  --ink:#f4efe6; --sub:#a39a8b; --line:rgba(212,168,75,.22); --line2:rgba(255,255,255,.08);
  --gold:#d4a84b; --gold-hi:#f3dc9b; --gold-lo:#8a6320;
  --gold-grad:linear-gradient(135deg,#f3dc9b 0%,#d4a84b 42%,#9a6f22 100%);
  --ok:#8bd0a0; --warn:#e6b25a; --err:#f08a80;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
/* 名刺の黒いシルク地 */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(900px 520px at 88% -8%,rgba(255,255,255,.075),transparent 62%),
   radial-gradient(700px 500px at 10% 110%,rgba(212,168,75,.09),transparent 62%),
   radial-gradient(500px 300px at 60% 40%,rgba(255,255,255,.025),transparent 70%),var(--bg)}
.swoosh{position:fixed;right:0;bottom:0;width:min(1000px,150vw);z-index:-1;pointer-events:none;opacity:.3}
.swoosh.strong{opacity:.42;inset:0;width:100vw;height:100vh;transform:translateX(24%)}
@media(min-width:900px){.swoosh.strong{transform:none;opacity:.7}}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

/* ロゴ */
.mark{display:inline-flex;flex-direction:column;line-height:1;color:#fff}
.mark .co{font:500 11px/1 var(--serif);letter-spacing:.3em;margin-left:.2em}
.mark .wz{font:800 34px/1.05 var(--serif);letter-spacing:.02em;font-style:italic;margin-top:2px}
.mark .wk{font:500 20px/1 var(--serif);letter-spacing:.3em;display:flex;align-items:center;gap:1px;margin-top:2px}
.mark .ap{width:.95em;height:.95em}
.mark.sm .co{display:none}.mark.sm .wz{font-size:17px}.mark.sm .wk{font-size:11px;margin-top:0}
.mark.sm{flex-direction:row;align-items:baseline;gap:6px}

/* 入力部品 */
label,.lb{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:18px 0 7px;letter-spacing:.06em}
label b,.lb b{color:var(--gold);font-weight:700;margin-left:4px}
input,select,textarea{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--line2);background:var(--field);border-radius:8px;outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#5f574b}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,75,.16)}
textarea{min-height:92px;resize:vertical;line-height:1.7}
textarea.tall{min-height:170px}
input[type=date]{min-height:47px}
.btn{border:0;background:var(--gold-grad);color:#1a1206;padding:12px 22px;border-radius:8px;cursor:pointer;font-weight:700;letter-spacing:.06em;box-shadow:0 6px 18px rgba(212,168,75,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--err);border:1px solid rgba(240,138,128,.35);box-shadow:none}
.btn.small{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font:11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{height:1px;background:linear-gradient(90deg,var(--gold),transparent);border:0;margin:14px 0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb,.pr{border:1px solid var(--line2);background:var(--field);color:var(--sub);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.cb.on{border-color:var(--gold);color:#1a1206;background:var(--gold-grad);font-weight:700}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pr{font-size:12.5px;padding:4px 11px;border-style:dashed;border-color:var(--line)}
.pr.on{color:var(--gold);border-style:solid;border-color:var(--gold)}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;cursor:pointer;margin-top:18px;text-align:left}
.tog span.t{font-size:14px;color:var(--ink)}
.tog i{width:44px;height:26px;border-radius:99px;background:#2a2622;position:relative;transition:.2s;flex:none}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8b8172;transition:.2s}
.tog.on i{background:var(--gold-grad)}
.tog.on i::after{left:21px;background:#1a1206}

/* バー */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,10,9,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;display:flex;justify-content:center}
.link{background:none;border:0;color:var(--sub);cursor:pointer;padding:6px 0;font-size:14px}
.stat{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--line2);white-space:nowrap;color:var(--sub)}
.stat.saved{color:var(--ok);border-color:rgba(139,208,160,.4)}
.stat.dirty,.stat.local,.stat.saving{color:var(--warn);border-color:rgba(230,178,90,.45)}
.stat.error{color:var(--err);border-color:rgba(240,138,128,.5)}
.prog{height:2px;background:var(--line2)}
.prog i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .3s}

/* ログイン */
.login{min-height:100vh;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between;max-width:560px;margin:0 auto;position:relative}
.login .head h1{font-size:clamp(30px,8.4vw,44px);line-height:1.35;margin:40px 0 12px}
.login .lead{color:var(--sub);max-width:30em}
.login .form{margin-top:12px;max-width:380px}
.login .foot{color:var(--sub);font-size:11px;letter-spacing:.2em;padding-top:30px}
.ul{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;background:transparent}
.ul:focus{box-shadow:none;border-bottom-color:var(--gold)}
.err{color:var(--err);font-size:13px;margin-top:10px}

/* 一覧 */
.hero{padding:30px 0 6px}
.hero h2{font-size:30px}
.search{margin-top:16px}
.row{display:block;width:100%;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-top:11px;cursor:pointer;position:relative}
.row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-grad)}
.row .n{font:700 19px/1.4 var(--serif)}
.row .m{font-size:12.5px;color:var(--sub);margin-top:3px}
.badge{display:inline-block;font:600 11px/1 system-ui;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--gold);margin-left:8px;vertical-align:middle;letter-spacing:.06em}
.badge.warn{color:var(--warn);border-color:rgba(230,178,90,.5)}

/* 入力フォームのセクション */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:20px 0 18px}
.tabs button{background:none;border:0;padding:11px 2px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;letter-spacing:.06em}
.tabs button.on{color:var(--gold-hi);border-color:var(--gold)}
details.sec{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.sec .no{font:800 26px/1 var(--serif);font-style:italic;color:var(--gold);min-width:34px}
.sec .tt{flex:1;font:700 18px/1.3 var(--serif)}
.sec .tt small{display:block;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--sub);margin-bottom:5px}
.sec .cnt{font-size:12px;color:var(--sub)}
.sec .cnt.full{color:var(--gold)}
.sec>summary::after{content:"＋";color:var(--gold);font-size:18px}
.sec[open]>summary::after{content:"－"}
.sec .body{padding:0 18px 20px;border-top:1px solid var(--line2)}
.two{display:grid;gap:0 14px}
@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.note.warn{color:var(--warn)}

/* 撮影対象 */
.item{border:1px solid var(--line2);border-radius:10px;padding:13px;margin-top:11px;background:var(--field)}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .nm{font-weight:700;flex:1;font-family:var(--serif);font-size:16px}
.item .pc{color:var(--gold);font-size:13px}
.item p{margin:6px 0 0;color:var(--sub);white-space:pre-wrap;font-size:14px}
.kind{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--gold);white-space:nowrap}
.star{color:var(--gold-hi)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;line-height:22px;padding:0}
.thumb .st{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.65);color:#fff}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px dashed var(--gold);color:var(--gold);padding:10px 15px;border-radius:8px;font-weight:600;margin:0}
.filebtn input{display:none}
.empty{color:var(--sub);padding:18px 0;font-size:14px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}

/* 編集者ビュー（案件カルテ） */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:24px 20px}
.k .store{font:800 clamp(30px,8vw,48px)/1.25 var(--serif);margin:12px 0 4px}
.k .catch{font:500 clamp(16px,4.4vw,20px)/1.6 var(--serif);color:var(--gold-hi)}
.k .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.k .blk{margin-top:26px}
.k .blk>.eyebrow{display:flex;align-items:center;gap:12px}
.k .blk>.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.k dl{margin:10px 0 0;display:grid;grid-template-columns:8.5em 1fr;gap:9px 14px}
.k dt{color:var(--sub);font-size:13px}
.k dd{margin:0;white-space:pre-wrap;word-break:break-word}
@media(max-width:520px){.k dl{grid-template-columns:1fr;gap:0}.k dd{margin-bottom:10px}}
.k .lead{font-size:16px;white-space:pre-wrap;margin:8px 0 0}
.k .cat{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:12px}
.k .cat .item{margin:0}
.k .thumb{width:calc(50% - 4px);height:auto;aspect-ratio:1}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold-grad);color:#1a1206;font-weight:700;padding:10px 18px;border-radius:99px;font-size:14px;z-index:50;max-width:90vw}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(11,10,9,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15}
.dock .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center}
.dock .msg{flex:1;font-size:12.5px;color:var(--sub);line-height:1.45}
.bad{border-color:var(--err)!important;box-shadow:0 0 0 3px rgba(240,138,128,.25)!important}
.vidbar{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:4px}
.vidbar .note{margin-top:2px}
.diag{white-space:pre-wrap;word-break:break-all;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--sub);background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:10px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body data-open-case="<?= c ?>">
<svg class="swoosh" id="swoosh" viewBox="0 0 860 520" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5a1a"/><stop offset=".45" stop-color="#e9c765"/><stop offset="1" stop-color="#8f6a1f"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".5" stop-color="#cfcfcf" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M528 0 C528 120 470 250 330 325 C228 380 150 440 98 520 L84 520 C138 430 226 366 326 296 C452 208 512 112 510 0 Z" fill="url(#g1)"/>
  <path d="M540 0 C548 150 490 262 356 345 C262 402 190 460 150 520 L100 520 C150 448 236 394 338 330 C470 246 542 130 534 0 Z" fill="url(#g2)"/>
</svg>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   ワザモノworks 案件カルテ
   ・入力は1文字ごとに端末へ自動保存（別ページに移動しても消えない）
   ・スプレッドシートへは自動で同期。失敗しても端末側に残り、再送する
   ========================================================= */
const ITEM_KINDS = ['料理','ドリンク','物販','その他'];
const SALES = ['工藤','井出','坂尻','その他'];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* 入力項目の定義（k = スプレッドシートの列見出しになる） */
const SECTIONS = [
  { id:'basic', no:'01', en:'BASIC', title:'基本情報', open:true, fields:[
    { k:'案件ステータス', t:'chips', opts:['商談中','獲得','稼働中','保留'], def:'獲得' },
    { k:'店舗名', t:'text', ph:'例：季節の食堂', req:1 },
    { k:'業態・ジャンル', t:'text', ph:'例：カジュアルフレンチ／ラーメン／美容室', half:1 },
    { k:'エリア・住所', t:'text', ph:'例：大阪市北区…', half:1 },
    { k:'営業担当', t:'chips', opts:SALES },
    { k:'獲得日', t:'date', def:today, half:1 },
    { k:'先方ご担当者', t:'text', ph:'例：オーナー 山田様', half:1 },
    { k:'先方の連絡先', t:'text', ph:'電話・LINE・メールなど' },
    { k:'公式アカウント・URL', t:'area', ph:'Instagram / HP / 食べログ / Googleマップなど' },
  ]},
  { id:'plan', no:'02', en:'CONTRACT', title:'契約・プラン', open:true, fields:[
    { k:'プラン内容', t:'text', ph:'例：リール2本・画像28投稿',
      presets:['リール1本・画像15','リール2本・画像15','リール2本・画像28投稿','リール4本・画像15','画像カラグレ納品のみ'] },
    { k:'撮影期間', t:'text', ph:'例：4か月に一回',
      presets:['毎月','3か月に一回','4か月に一回','半年に1回','未定'] },
    { k:'打ち合わせ必須', t:'toggle', label:'撮影前に打ち合わせが必須' },
    { k:'契約開始・期間', t:'text', ph:'例：2026年11月〜／3ヶ月運用その後未定', half:1 },
    { k:'月額・金額', t:'text', ph:'例：月額○○円（税別）', half:1 },
    { k:'支払い条件', t:'text', ph:'例：月末締め翌月末払い／請求書払い' },
    { k:'広告運用', t:'toggle', label:'広告運用を行う' },
    { k:'広告予算・方針', t:'text', ph:'例：広告1日1000円／月予算15万円',
      presets:['広告なし','広告1日500円','広告1日1000円'] },
  ]},
  { id:'hear', no:'03', en:'HEARING', title:'ヒアリング内容', open:true, fields:[
    { k:'現在の課題・お悩み', t:'area', ph:'例：新規のお客様が少ない／SNSの更新が止まっている' },
    { k:'この案件のゴール', t:'multi', opts:['新規集客','リピート','認知拡大','ブランディング','採用','EC・物販','予約増','その他'] },
    { k:'ターゲット層', t:'area', ph:'例：30〜40代の会社員、記念日利用の20代カップル' },
    { k:'店舗の強み・こだわり', t:'area', ph:'例：炭火で仕上げる旬魚、目の前で伝わるライブ感' },
    { k:'世界観・トーン', t:'multi', opts:['高級感','カジュアル','シズル感','温かみ','クール','ポップ','和','洋','ナチュラル'] },
    { k:'トーン補足・参考イメージ', t:'area', ph:'イメージに近い雰囲気、色、BGMなど' },
    { k:'競合・参考にしたいアカウント', t:'area', ph:'@アカウント名 や URL' },
    { k:'投稿の希望', t:'multi', opts:['リール','画像投稿','ストーリーズ','ハイライト','固定投稿','動画編集','文字入れ'] },
    { k:'NG・避けたいこと', t:'area', ph:'例：顔出しNG／価格の表記NG／他店比較NG' },
  ]},
  { id:'shoot', no:'04', en:'SHOOTING', title:'撮影の準備', open:false, fields:[
    { k:'初回撮影日', t:'date', half:1 },
    { k:'次回撮影', t:'date', half:1 },
    { k:'撮影できる曜日・時間帯', t:'text', ph:'例：定休日の月曜 14〜17時／営業前 10時〜' },
    { k:'撮影場所・駐車場', t:'text', ph:'例：店内＋外観。近くにコインパーキングあり' },
    { k:'当日の立会い者', t:'text', ph:'例：店長 佐藤様' },
    { k:'撮影当日の注意', t:'area', ph:'例：営業中のため音は控えめに／提供できる食材は3品まで' },
  ]},
  { id:'acct', no:'05', en:'ACCOUNT', title:'アカウント・素材', open:false, fields:[
    { k:'Instagram ID', t:'text', ph:'例：kisetsu_shokudo' },
    { k:'ログイン（ID/PASS）', t:'area', ph:'SNSなどのIDとパスワード',
      hint:'※ パスワードはスプレッドシートに文字のまま残ります。共有範囲にご注意ください。', warn:1 },
    { k:'ロゴ・素材の受け取り', t:'text', ph:'例：ロゴはメールで受領済み／メニュー表は次回撮影時' },
  ]},
  { id:'memo', no:'06', en:'MEMO', title:'商談メモ・編集者への共有', open:true, fields:[
    { k:'商談メモ・経緯', t:'area', tall:1, ph:'商談で聞いたこと、決まったこと、先方の反応など自由に' },
    { k:'次のアクション', t:'area', ph:'例：10/5までに契約書送付／撮影日程を電話で確定' },
    { k:'店舗キャッチコピー', t:'text', ph:'例：旬を、ほどよく、毎日の食卓へ。' },
    { k:'この案件で最も伝えること', t:'area', ph:'例：炭火で仕上げる旬魚と、目の前で伝わるライブ感' },
    { k:'編集者へのひとこと', t:'area', ph:'編集上の補足（トーン・NG・参考など）' },
  ]},
  { id:'video', no:'07', en:'VIDEO', title:'動画編集の依頼', open:false, fields:[
    { k:'編集月', t:'month', def:() => today().slice(0, 7), half:1 },

/* ---------- 端末内ストレージ (IndexedDB + localStorage ミラー) ---------- */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('wazamono-karte', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  let dead = false;   // iPhoneのSafariやLINE内ブラウザでは、保存先への接続が固まることがある。一度でも固まったら以後は使わない
  const guard = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => { dead = true; rej(new Error('idb timeout')); }, ms))]);
  const run = (mode, fn) => dead ? Promise.reject(new Error('idb dead')) : guard(open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  })), 1500);
  return {
    get: k => run('readonly', s => s.get(k)).then(v => v ?? null).catch(() => null),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => {}),
    del: k => run('readwrite', s => s.delete(k)).catch(() => {}),
    keys: () => run('readonly', s => s.getAllKeys()).catch(() => []),
    isDead: () => dead,
  };
})();
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem('wk:' + k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem('wk:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem('wk:' + k); } catch (e) {} },
  keys(){ try { return Object.keys(localStorage).filter(k => k.startsWith('wk:')).map(k => k.slice(3)); } catch (e) { return []; } },
};

const S = { pw:'', editor:'', drafts:new Map(), cur:null, tab:'input', list:[], listErr:'', q:'', syncing:new Set(), timers:{}, open:{} };

// 別サイト（通常のWebページ）として開かれたときの送信先。Apps Script のウェブアプリURL
const API_URL = 'https://script.google.com/macros/s/AKfycbyhr1J5-K6iPV4olcpgemqWwccTytvqUy0I70VE3w5ZlaedXBjRrf9cn5UsnFdIBOF7/exec';
const USE_MOCK = /[?&]mock=1/.test(location.search);   // 手元で画面だけ試すとき（?mock=1、パスワードは test）

function api(fn, arg){
  const call = new Promise((resolve, reject) => {
    const done = r => {
      if (r && r.ok) resolve(r.data);
      else { const e = new Error((r && r.error) || 'error'); e.code = r && r.error; reject(e); }
    };
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done)
        .withFailureHandler(e => reject(new Error((e && e.message) || String(e))))
        .rpc(fn, S.pw, arg);
    } else if (API_URL && !USE_MOCK) {
      // 通常のWebページから送る。Googleアカウントの状態に左右されない（複数ログイン中のスマホでも開ける）
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, pw: S.pw, arg }) })
        .then(r => r.json())
        .then(done, e => reject(new Error('サーバーに接続できません（' + ((e && e.message) || e) + '）')));
    } else {
      mockRpc(fn, S.pw, arg).then(done, reject);   // ローカルで画面だけ試すとき
    }
  });
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('通信がタイムアウトしました（電波の良い場所で再度お試しください）')), 45000));
  return Promise.race([call, timeout]);
}

/* ローカル確認用の疑似サーバー（Apps Script 上では使われません。パスワードは test） */
async function mockRpc(fn, pw, arg){
  await wait(250);
  if (pw !== 'test') return { ok:false, error:'auth' };
  const db = ls.get('mockdb') || { cases:{}, items:{} };
  const now = new Date().toISOString().replace('T',' ').slice(0,19).replace(/-/g,'/');
  let data = null;
  if (fn === 'login') data = { mode: 'test' };
  else if (fn === 'listCases') data = Object.values(db.cases).filter(c => c.state !== '削除')
    .map(c => ({ id:c.id, storeName:c.fields['店舗名'], status:c.fields['案件ステータス'], sales:c.fields['営業担当'], catchcopy:c.fields['店舗キャッチコピー'], updatedAt:c.updatedAt, updatedBy:c.updatedBy, itemCount:(db.items[c.id]||[]).length }))
    .sort((a,b) => b.updatedAt.localeCompare(a.updatedAt));
  else if (fn === 'getCase') data = db.cases[arg] && db.cases[arg].state !== '削除' ? { case:{ id:arg, fields:db.cases[arg].fields, updatedAt:db.cases[arg].updatedAt }, items:db.items[arg] || [], video:db.cases[arg].video || null } : null;
  else if (fn === 'saveCase') {
    const c = arg.case;
    db.cases[c.id] = { id:c.id, fields:c.fields, state:'進行中', updatedAt:now, updatedBy:arg.editor || '' };
    const prev = db.cases[c.id] && db.cases[c.id].video;
    db.cases[c.id].video = prev || null;
    let videoError = '';
    if (!prev && arg.registerVideo) db.cases[c.id].video = { sheet:'動画管理表_テスト', name:'01｜' + (c.fields['店舗名'] || '') + ' ｜' + (c.fields['動画の納期'] || '').replace(/-/g, '') };
    db.items[c.id] = arg.items; ls.set('mockdb', db); data = { updatedAt: now, video: db.cases[c.id].video, videoError };
  }
  else if (fn === 'uploadPhoto') data = { url: arg.dataUrl };
  else if (fn === 'deleteCase') { if (db.cases[arg]) db.cases[arg].state = '削除'; ls.set('mockdb', db); data = true; }
  return { ok:true, data };
}

async function loadLocalDraft(id){
  if (S.drafts.has(id)) return S.drafts.get(id);

}
async function localDraftIds(){

/* ---------- 同期 ---------- */
function setStatus(d, st, msg){ d.status = st; d.statusMsg = msg || ''; if (S.cur === d) paintStatus(); }
function markDirty(d){
  d.dirty = true; d.rev++; d.local = d.local && !d.baseUpdatedAt;
  persistSoon(d);
  setStatus(d, hasContent(d) ? 'dirty' : 'local');
  syncSoon(d, 1500);
}
function syncSoon(d, ms){ clearTimeout(S.timers['s' + d.id]); S.timers['s' + d.id] = setTimeout(() => sync(d), ms); }
async function sync(d){
  if (!d.dirty) return;
  if (!hasContent(d)) { setStatus(d, 'local'); return; }
  if (S.syncing.has(d.id)) { d.again = true; return; }
  if (!navigator.onLine) { setStatus(d, 'error', 'オフライン。端末に保存済み。回線が戻ると自動で送ります'); return; }
  S.syncing.add(d.id); setStatus(d, 'saving');
  const rev = d.rev;
  try {
    for (const it of d.items) for (const p of it.photos) {
      if (!p.url && p.dataUrl) {
        const r = await api('uploadPhoto', { name: p.name || (p.id + '.jpg'), dataUrl: p.dataUrl });
        p.url = r.url; delete p.dataUrl; persistNow(d);
      }
    }
    const payload = {
      case: { id:d.id, fields:d.case.fields }, editor: S.editor, registerVideo: !!d.wantRegister,
      items: d.items.map(i => ({ id:i.id, kind:i.kind, name:i.name, price:i.price || '', note:i.note, star:i.star || '', photos:i.photos.filter(p => p.url).map(p => ({ id:p.id, url:p.url })) })),
    };
    const r = await api('saveCase', payload);
    d.baseUpdatedAt = r.updatedAt; d.local = false;
    if (d.rev === rev) { d.dirty = false; setStatus(d, 'saved'); } else d.again = true;
    if (r.video) d.video = r.video;
    if (d.wantRegister) { d.wantRegister = false; if (r.video && !r.videoError) toast(S.mode === 'test' ? '「動画管理表_テスト」タブに登録しました（本番の月別タブにはまだ入りません）' : '動画管理表に登録しました'); }
    if (r.videoError) { toast('保存OK。ただし動画管理表への反映に失敗: ' + r.videoError); const ve = $('#viderr'); if (ve) ve.textContent = r.videoError; }
    if (S.cur === d) paintVideo();
    persistNow(d);
  } catch (e) {
    if (e.code === 'auth') { logout(true); return; }
    setStatus(d, 'error', '送信に失敗（端末には保存済み）: ' + e.message);
    clearTimeout(d.retry); d.retry = setTimeout(() => sync(d), 20000);
  } finally {
    S.syncing.delete(d.id);
    if (d.again) { d.again = false; syncSoon(d, 300); }
  }
}
async function syncAll(){
  if (!S.pw) return;
  for (const id of await localDraftIds()) { const d = await loadLocalDraft(id); if (d && d.dirty) sync(d); }
}

async function openCase(id, tab){
  S.tab = tab;
  if (S.cur && S.cur.id === id) { renderCase(); return; }
  swoosh(false);
  $('#app').innerHTML = '<div class="wrap"><div class="empty" style="padding-top:40px">読み込み中…</div></div>';
  let d = await loadLocalDraft(id);
  const useLocal = d && (d.dirty || !formEmpty(d.form) || d.local);
  if (!useLocal) {
    try {
      const r = await api('getCase', id);
      if (!r) { alert('この案件は見つかりませんでした'); return go('#/'); }
      const fresh = newDraft().case.fields;
      Object.keys(fresh).forEach(k => fresh[k] = r.case.fields[k] ?? '');
      d = { id, case:{ id, fields:fresh }, items:r.items, video:r.video || null, form:(d && d.form) || newForm(), dirty:false, baseUpdatedAt:r.case.updatedAt, rev:0, ts:Date.now(), local:false };
      S.drafts.set(id, d); persistNow(d);

      if (e.code === 'auth') return logout(true);
      if (!d) { $('#app').innerHTML = `<div class="wrap"><p class="err">読み込めませんでした: ${esc(e.message)}</p><button class="btn" onclick="location.hash='#/'">一覧へ</button></div>`; return; }
    }
  }
  S.cur = d; if (!d.status) d.status = d.dirty ? 'dirty' : 'saved';
  renderCase();
  if (d.dirty) syncSoon(d, 500);
}

const getV = (sc, k) => sc === 'f' ? (S.cur.case.fields[k] ?? '') : (S.cur.form[k] ?? '');
function fieldHtml(f, sc = 'f'){
  const v = getV(sc, f.k), a = `data-s="${sc}" data-k="${esc(f.k)}"`;
  const lab = `<label>${esc(f.k)}${f.req ? '<b>必須</b>' : ''}</label>`;
  const hint = f.hint ? `<div class="note ${f.warn ? 'warn' : ''}">${esc(f.hint)}</div>` : '';
  let h = '';
  if (f.t === 'text') h = `${lab}${f.presets ? `<div class="presets">${f.presets.map(p => `<button type="button" class="pr ${p === v ? 'on' : ''}" ${a} data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}<input ${a} placeholder="${esc(f.ph || '')}" value="${esc(v)}">${hint}`;
  else if (f.t === 'area') h = `${lab}<textarea class="${f.tall ? 'tall' : ''}" ${a} placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${hint}`;
  else if (f.t === 'date' || f.t === 'month') h = `${lab}<input type="${f.t}" ${a} value="${esc(v)}">`;
  else if (f.t === 'videoreg') h = '<div id="videoreg" style="margin-top:18px"></div>';
  else if (f.t === 'chips' || f.t === 'multi') {
    const sel = f.t === 'multi' ? v.split('、').filter(Boolean) : [v];
    h = `<div class="lb">${esc(f.k)}</div><div class="chips" ${a} data-m="${f.t}">${f.opts.map(o => `<button type="button" class="cb ${sel.includes(o) ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>${hint}`;
  }
  else if (f.t === 'toggle') h = `<button type="button" class="tog ${v === 'はい' ? 'on' : ''}" ${a}><span class="t">${esc(f.label)}</span><i></i></button>`;
  return f.half ? `<div>${h}</div>` : h;
}
function groupHalves(fields){
  let out = '', buf = [];
  const flush = () => { if (buf.length) { out += `<div class="two">${buf.join('')}</div>`; buf = []; } };
  fields.forEach(f => { if (f.half) buf.push(fieldHtml(f)); else { flush(); out += fieldHtml(f); } });
  flush(); return out;
}
function itemFormHtml(){

function setV(sc, k, v){

      d.case.fields['編集月'] = v.slice(0, 7);

function onInput(e){

function onClick(e){
  const b = e.target.closest('button'); if (!b) return;
  const d = S.cur;
  if (b.classList.contains('cb')) {
    const wrap = b.parentElement, sc = wrap.dataset.s, k = wrap.dataset.k, v = b.dataset.v, multi = wrap.dataset.m === 'multi';
    let cur = getV(sc, k);
    if (multi) { const arr = cur.split('、').filter(Boolean); const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); cur = arr.join('、'); }
    else cur = cur === v ? '' : v;
    setV(sc, k, cur);
    const sel = multi ? cur.split('、') : [cur];
    $$('.cb', wrap).forEach(x => x.classList.toggle('on', sel.includes(x.dataset.v)));
  }

    const sc = b.dataset.s, k = b.dataset.k, on = b.classList.contains('on'), v = on ? '' : b.dataset.v;

  else if (b.dataset.a === 'regvideo') regVideo();
  else if (b.dataset.a === 'vidgo') { const m = videoMissing(S.cur); m.length ? openVideoSection(m[0]) : regVideo(); }
  else if (b.dataset.a === 'del') deleteCase();
}

function renderView(){
  const d = S.cur, v = d.case.fields, show = k => (v[k] || '').trim();
  const blocks = VIEW_BLOCKS.map(([t, ks]) => [t, ks.filter(show)]).filter(b => b[1].length);
  const kinds = ITEM_KINDS.map(k => [k, d.items.filter(i => i.kind === k)]).filter(g => g[1].length);
  const ph = t => `<span style="color:var(--sub)">${t}</span>`;
  $('#pane').innerHTML = `
  <div class="card k">
    <div class="eyebrow">CASE KARTE</div>
    <div class="store">${esc(show(F_STORE)) || ph('店舗名を入力')}</div>
    <div class="catch">${esc(show('店舗キャッチコピー'))}</div>
    <div class="meta">${show('案件ステータス') ? `<span class="badge" style="margin:0">${esc(v['案件ステータス'])}</span>` : ''}${v['打ち合わせ必須'] ? '<span class="badge warn" style="margin:0">打ち合わせ必須</span>' : ''}${show('プラン内容') ? `<span class="badge" style="margin:0">${esc(v['プラン内容'])}</span>` : ''}</div>
    ${show('この案件で最も伝えること') ? `<div class="blk"><div class="eyebrow">最も伝えること</div><p class="lead serif">${esc(v['この案件で最も伝えること'])}</p></div>` : ''}
    ${show('編集者へのひとこと') ? `<div class="blk"><div class="eyebrow">編集者へのひとこと</div><p class="lead">${esc(v['編集者へのひとこと'])}</p></div>` : ''}
    ${blocks.map(([t, ks]) => `<div class="blk"><div class="eyebrow">${t}</div><dl>${ks.map(k => `<dt>${esc(k)}</dt><dd>${esc(v[k])}</dd>`).join('')}</dl></div>`).join('')}
    <div class="blk"><div class="eyebrow">撮影対象カタログ</div>
      ${kinds.length ? kinds.map(([k, arr]) => `
        <h3 style="margin-top:16px;font-size:18px">${k}<span class="badge">${arr.length}</span></h3>
        <div class="cat">${arr.map(i => `
          <div class="item"><div class="top"><span class="nm">${i.star ? '<span class="star">★</span> ' : ''}${esc(i.name)}</span>${i.price ? `<span class="pc">${esc(i.price)}</span>` : ''}</div>
          ${i.note ? `<p>${esc(i.note)}</p>` : ''}
          ${i.photos.length ? `<div class="thumbs">${i.photos.map(p => `<a class="thumb" ${p.url && /^https?:/.test(p.url) ? `href="${esc(p.url)}" target="_blank" rel="noopener"` : ''}><img src="${esc(thumb(p))}" alt=""></a>`).join('')}</div>` : ''}
          </div>`).join('')}</div>`).join('') : '<div class="empty">入力画面から撮影対象を追加してください。</div>'}
    </div>
    <div class="actions" style="margin-top:26px"><button class="btn ghost" id="copy">📋 テキストでコピー（LINE共有用）</button></div>
  </div>`;
  $('#copy').onclick = copyText;
}
function copyText(){
  const d = S.cur, v = d.case.fields, L = [];
  L.push('【' + (v[F_STORE] || '店舗名未入力') + '】' + (v['案件ステータス'] ? '（' + v['案件ステータス'] + '）' : ''));
  if (v['店舗キャッチコピー']) L.push(v['店舗キャッチコピー']);
  VIEW_BLOCKS.forEach(([t, ks]) => {
    const rows = ks.filter(k => k !== 'ログイン（ID/PASS）' && (v[k] || '').trim()); if (!rows.length) return;
    L.push('', '■' + t); rows.forEach(k => L.push(k + '：' + v[k]));
  });
  ['この案件で最も伝えること','編集者へのひとこと'].forEach(k => { if ((v[k] || '').trim()) L.push('', '■' + k, v[k]); });
  if (d.items.length) { L.push('', '■撮影対象'); d.items.forEach(i => L.push((i.star ? '★' : '・') + i.name + '（' + i.kind + (i.price ? '／' + i.price : '') + '）' + (i.note ? ' ' + i.note.replace(/\n/g, ' ') : ''))); }
  const text = L.join('\n');
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch (e) { toast('コピーできませんでした'); } t.remove(); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(() => toast('コピーしました（ログイン情報は含みません）'), fallback) : fallback();
}

/* ---------- 写真 ---------- */
function thumb(p){
  if (p.dataUrl) return p.dataUrl;
  const m = p.url && p.url.match(/\/d\/([\w-]+)/) || p.url && p.url.match(/[?&]id=([\w-]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w600` : (p.url || '');
}
function compress(file, max = 1600, q = 0.82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }

boot();
</script>
